distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 官方地址：https\://services.gradle.org/distributions/gradle-8.11-bin.zip
# 官方 307 跳到 GitHub Releases，境内实测 60KB/s，136MB 要半个多小时，wrapper 等不到就超时了。
# 腾讯云镜像不能用：对 curl 给真 zip，对 Java HttpURLConnection 返回 989 字节 JS 反爬页，
# 而 wrapper 正是用后者下载的，解包时报 zip END header not found。
# 华为云这个对 Java 客户端正常返回，且 sha256 与官方逐字节一致（57dafb5c...f1e9）。
distributionUrl=https\://mirrors.huaweicloud.com/gradle/gradle-8.11-bin.zip
networkTimeout=30000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
