distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 官方地址：https\://services.gradle.org/distributions/gradle-8.11-bin.zip
# 需求方在境内，那个域名连不上（SocketTimeoutException），所以走腾讯云镜像——同一个文件。
# 换到能直连官方机器的环境就把上面那行换回来。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.11-bin.zip
networkTimeout=30000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
